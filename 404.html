<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - System Error</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }
        
        .error-code {
            font-size: 8rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            color: transparent;
            -webkit-text-stroke: 2px #f0f;
            text-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
            margin: 0;
            line-height: 1;
            position: relative;
            animation: glitch-anim 2s infinite linear alternate-reverse;
        }

        .error-code::before,
        .error-code::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: #0ff;
            -webkit-text-stroke: 0;
            z-index: -1;
        }

        .error-code::before {
            left: 4px;
            text-shadow: -2px 0 #f0f;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .error-code::after {
            left: -4px;
            text-shadow: -2px 0 #0ff;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(21px, 9999px, 83px, 0); transform: skew(0.65deg); }
            5% { clip: rect(69px, 9999px, 7px, 0); transform: skew(0.4deg); }
            10% { clip: rect(59px, 9999px, 72px, 0); transform: skew(0.79deg); }
            15% { clip: rect(89px, 9999px, 46px, 0); transform: skew(0.33deg); }
            20% { clip: rect(13px, 9999px, 2px, 0); transform: skew(0.4deg); }
            25% { clip: rect(13px, 9999px, 49px, 0); transform: skew(0.48deg); }
            30% { clip: rect(88px, 9999px, 20px, 0); transform: skew(0.43deg); }
            35% { clip: rect(11px, 9999px, 81px, 0); transform: skew(0.85deg); }
            40% { clip: rect(11px, 9999px, 14px, 0); transform: skew(0.01deg); }
            45% { clip: rect(22px, 9999px, 3px, 0); transform: skew(0.47deg); }
            50% { clip: rect(68px, 9999px, 29px, 0); transform: skew(0.12deg); }
            55% { clip: rect(81px, 9999px, 57px, 0); transform: skew(0.6deg); }
            60% { clip: rect(85px, 9999px, 43px, 0); transform: skew(0.12deg); }
            65% { clip: rect(15px, 9999px, 80px, 0); transform: skew(0.25deg); }
            70% { clip: rect(51px, 9999px, 60px, 0); transform: skew(0.82deg); }
            75% { clip: rect(27px, 9999px, 62px, 0); transform: skew(0.71deg); }
            80% { clip: rect(85px, 9999px, 82px, 0); transform: skew(0.6deg); }
            85% { clip: rect(100px, 9999px, 32px, 0); transform: skew(0.68deg); }
            90% { clip: rect(20px, 9999px, 6px, 0); transform: skew(0.24deg); }
            95% { clip: rect(51px, 9999px, 19px, 0); transform: skew(0.53deg); }
            100% { clip: rect(2px, 9999px, 78px, 0); transform: skew(0.51deg); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(65px, 9999px, 100px, 0); transform: skew(0.45deg); }
            5% { clip: rect(52px, 9999px, 74px, 0); transform: skew(0.43deg); }
            10% { clip: rect(79px, 9999px, 85px, 0); transform: skew(0.67deg); }
            15% { clip: rect(75px, 9999px, 5px, 0); transform: skew(0.51deg); }
            20% { clip: rect(67px, 9999px, 62px, 0); transform: skew(0.69deg); }
            25% { clip: rect(14px, 9999px, 79px, 0); transform: skew(0.22deg); }
            30% { clip: rect(1px, 9999px, 66px, 0); transform: skew(0.79deg); }
            35% { clip: rect(86px, 9999px, 30px, 0); transform: skew(0.83deg); }
            40% { clip: rect(23px, 9999px, 98px, 0); transform: skew(0.75deg); }
            45% { clip: rect(85px, 9999px, 72px, 0); transform: skew(0.01deg); }
            50% { clip: rect(71px, 9999px, 75px, 0); transform: skew(0.33deg); }
            55% { clip: rect(2px, 9999px, 48px, 0); transform: skew(0.48deg); }
            60% { clip: rect(30px, 9999px, 16px, 0); transform: skew(0.74deg); }
            65% { clip: rect(59px, 9999px, 50px, 0); transform: skew(0.88deg); }
            70% { clip: rect(41px, 9999px, 62px, 0); transform: skew(0.4deg); }
            75% { clip: rect(2px, 9999px, 82px, 0); transform: skew(0.31deg); }
            80% { clip: rect(47px, 9999px, 73px, 0); transform: skew(0.61deg); }
            85% { clip: rect(3px, 9999px, 27px, 0); transform: skew(0.97deg); }
            90% { clip: rect(26px, 9999px, 55px, 0); transform: skew(0.49deg); }
            95% { clip: rect(42px, 9999px, 97px, 0); transform: skew(0.18deg); }
            100% { clip: rect(38px, 9999px, 49px, 0); transform: skew(0.25deg); }
        }

        .error-message {
            margin-top: 1rem;
            margin-bottom: 2.5rem;
            max-width: 600px;
        }

        .error-title {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px #0ff;
        }

        .error-desc {
            font-size: 1.1rem;
            color: #94a3b8;
            line-height: 1.6;
        }

        .error-btn {
            background: rgba(0, 255, 255, 0.1);
            color: #0ff;
            border: 1px solid #0ff;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            display: inline-block;
        }

        .error-btn:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 25px #0ff;
        }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
            pointer-events: none;
            perspective: 1000px;
            transform-origin: bottom;
            transform: rotateX(60deg) scale(2);
            animation: scanline 10s linear infinite;
        }

        @keyframes scanline {
            0% { background-position: 0 0; }
            100% { background-position: 0 300px; }
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, transparent 50%, #050505 100%);
            z-index: 2;
            pointer-events: none;
        }
    </style>
</head>
<body style="background: #050505; margin: 0; overflow: hidden; font-family: 'Outfit', sans-serif;">
    <div class="grid-bg"></div>
    <div class="vignette"></div>
    
    <div class="error-container">
        <h1 class="error-code" title="404">404</h1>
        <div class="error-message">
            <h2 class="error-title">Signal Lost</h2>
            <p class="error-desc">
                The dimensional coordinates you are trying to reach do not exist or the sector has been quarantined. Ensure your navigational uplinks are properly calibrated.
            </p>
        </div>
        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <button onclick="window.history.back()" class="error-btn" style="background: transparent; color: #f0f; border-color: #f0f; box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);">PREVIOUS PAGE</button>
            <a href="index.html" class="error-btn">REBOOT CONNECTION</a>
        </div>
    </div>
</body>
</html>
